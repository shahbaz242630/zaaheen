# cargo-deny configuration -- supply-chain gate for the dependency tree.
#
# Ported from the "Secrets and dependencies" gate already proven on
# tools-project, adapted from the npm ecosystem to Cargo. Runs in CI as a
# required status check on every pull request.
#
# WHY THIS EXISTS: CI verified that OUR code compiles, is warning-free and
# passes tests. Nothing verified the ~700 crates we ship inside the MSI. A
# dependency with a published RustSec advisory, an unexpected copyleft
# licence, or a crate pulled from somewhere other than crates.io would all
# have shipped to a beta user unnoticed.

[graph]
# Evaluate every platform we ship, not just the host. A Windows-only
# advisory must fail the Linux CI runner too, or the gate is theatre.
all-features = false

[advisories]
version = 2
# RustSec advisory database. Anything unignored that matches is an error.
#
# TRIAGED 2026-08-26, the first time this check ever ran on this repository.
# It found 24 advisories. Three were fixable and ARE fixed in this same commit
# (anyhow -> 1.0.103, crossbeam-epoch -> 0.9.20, h2 -> 0.4.16). The 21 below
# cannot be fixed by us today; each says why, and what would change that.
#
# THIS LIST IS DEBT, NOT ABSOLUTION. The check stays BLOCKING, so any NEW
# advisory fails the build from now on. Revisit whenever `lance` or `tauri` is
# upgraded -- both chains below move only when they do.
ignore = [
    # (The ten gtk-rs GTK3 "unmaintained" ignores, RUSTSEC-2024-0411..0420,
    # were removed in audit s104 SUP-10: cargo-deny reported them as matching
    # nothing, and an unused ignore can hide the advisory if it returns. The
    # crates are still in the lock, Linux-only through tauri -> wry; if they
    # are reported again, triage them afresh here.)

    # -- cloud object-store signing path ------------------------------------
    # All three arrive via the SAME chain:
    #   reqsign -> opendal -> lance-io -> lance -> lancedb -> vault-storage
    # `reqsign` signs cloud storage requests (AWS SigV4 / Azure / GCS) and
    # `opendal` abstracts cloud object stores. Zaaheen runs LanceDB
    # against the LOCAL FILESYSTEM: we sign no cloud requests and parse no
    # cloud XML responses, so this code is linked but never executed.
    #
    # Stated precisely: this is a REACHABILITY argument, not a guarantee. The
    # code is present in the binary. Both classes need the code to actually run
    # against attacker-influenced input, which requires a cloud backend we do
    # not configure. If a cloud backend is ever added -- Managed mode is the
    # obvious candidate -- these MUST be re-triaged before that ships.
    #
    # `cargo update` cannot fix quick-xml: reqsign requires ^0.37 and the fix
    # landed in 0.41, so the whole lance chain has to move first.
    "RUSTSEC-2023-0071", # rsa -- Marvin timing sidechannel. NO fixed version
                         #        exists upstream; the crate has no answer yet.
    "RUSTSEC-2026-0194", # quick-xml -- quadratic run time on duplicate attrs
    "RUSTSEC-2026-0195", # quick-xml -- unbounded namespace alloc (DoS)

    # -- unmaintained build-time and data crates ----------------------------
    # No fixed version published for any of these. They are transitive, and
    # none is reachable from a request path: proc-macro-error and paste run at
    # COMPILE time only, and the unic-* crates are static Unicode tables.
    # Resolved when the crates that depend on them move to maintained
    # replacements; nothing we can force. (The unic-* chain arrives through
    # tauri-utils 2.9; the tauri 2.12 family drops it, so these five go with
    # that upgrade.)
    "RUSTSEC-2024-0370", # proc-macro-error (build-time)
    "RUSTSEC-2024-0436", # paste (build-time)
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0134", # rustls-pemfile

    # -- zip 6.0.0: archive EXTRACTION flaws (triaged 2026-10-19, s100) -------
    # All three are about unpacking an untrusted archive: `ZipArchive::extract`
    # and `ZipStreamReader::extract` writing through symlinks, outside the
    # target, or keeping SUID/SGID bits. Fixed only in zip >= 9.0.0.
    # Two users, neither extracts untrusted input:
    #   - vault-app WRITES one zip (the Claude Desktop .mcpb bundle,
    #     connect.rs); it never calls extract (its tests only read entries).
    #   - libduckdb-sys uses zip as a BUILD dependency to unpack its own
    #     bundled sources on the build machine; it requires zip "6", so we
    #     cannot move to 9 until duckdb does.
    #   - zip 4.6.1 is in Cargo.lock for tauri-plugin-updater 2.12.0 (s115,
    #     ADR-SEC-051) but COMPILED NOWHERE: it is the plugin's Windows-only
    #     dependency behind its `zip` feature, which we turn on for the Mac
    #     only (for tar + flate2). Windows takes the bare .msi.
    # Resolved when duckdb's build moves to zip >= 9: then bump vault-app's pin
    # and drop these. Re-evaluate at once if we ever extract a user's zip, or
    # turn the updater's `zip` feature on for Windows.
    "RUSTSEC-2026-0367", # zip -- SUID/SGID bits kept on extract
    "RUSTSEC-2026-0368", # zip -- extract creates symlinks outside the target
    "RUSTSEC-2026-0369", # zip -- extract applies permissions through symlinks

    # -- zstd 0.13 / zstd-safe 7: fixed only in new majors (triaged 2026-10-27, s115)
    # Fixed in zstd >= 0.14.3 and zstd-safe >= 8.2.0, but every user requires
    # zstd ^0.13: arrow-ipc 57/56 and lance-encoding 4 (lancedb ->
    # vault-storage), tantivy-sstable 0.7 (our tantivy 0.26 in vault-retrieval)
    # and 0.5 (through lance). DuckDB bundles its own zstd. Their fourth sibling,
    # RUSTSEC-2026-0410 (zstd-sys, wasm allocator), IS fixed: zstd-sys 2.1.2.
    #   - 0391: only the stream `with_context` constructors carried a dead
    #     stream into the next. No user calls them: arrow-ipc decodes with
    #     `Decoder::with_buffer`, lance-encoding with stream::copy_decode,
    #     tantivy with zstd::bulk, each on a context of its own.
    #   - 0398: `Seekable` exists only with the `seekable` feature, which
    #     nothing in our tree enables; the code is not compiled.
    #   - 0403: REACHABLE IN PRINCIPLE: the `legacy` feature is on (zstd's
    #     default) and arrow-ipc and lance-encoding decode through the stream
    #     API. The input is the vault's own files, written by our own keeper
    #     on the user's own disk; a crafted legacy frame there needs write
    #     access to the vault folder, which already beats the app. We
    #     decompress no downloaded or received data with zstd.
    # Resolved when arrow, lance and tantivy move to zstd 0.14: drop these
    # three. Re-triage at once if zstd ever decodes data from outside the vault,
    # above all if Lance is ever pointed at a remote store or REST namespace
    # (the object_store / opendal cloud backends are compiled in; today
    # vector_store.rs connects only the local vault-sealed URI).
    "RUSTSEC-2026-0391", # zstd -- abandoned stream leaks into the next
    "RUSTSEC-2026-0398", # zstd-safe -- Seekable::decompress set_len past capacity
    "RUSTSEC-2026-0403", # zstd-safe -- legacy-frame error exposes uninit memory
]

[licenses]
version = 2
# We ship a COMMERCIAL desktop app in three modes (Local / BYOK / Managed).
# The repository being public does not make a strong-copyleft dependency
# safe: GPL/AGPL terms would reach the Managed service and the distributed
# binary. Permissive licences only, by allow-list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Unlicense",
    # Added 2026-08-26 after the first real run against the ~700-crate tree.
    # Both are permissive and carry no copyleft obligation on a distributed
    # binary; they were absent only because the initial list was written from
    # the common set rather than from what we actually depend on.
    "0BSD",              # BSD Zero Clause -- public-domain equivalent
    "CDLA-Permissive-2.0", # Community Data License Agreement, permissive
]
confidence-threshold = 0.8

# Our OWN crates declare `license = "Proprietary"`, which is not a valid SPDX
# expression, so without this every workspace member is reported "unlicensed"
# and the check fails on 13 false positives. `publish = false` in
# [workspace.package] is what marks them private; this tells cargo-deny to skip
# them. Third-party licences are unaffected -- that is the whole point of the
# check and it stays strict.
private = { ignore = true }

[bans]
# A duplicated crate version is usually harmless transitive drift, not a
# security event -- warn so it is visible without failing the build.
multiple-versions = "warn"
# A wildcard version requirement means a future publish can change what we
# ship without a lockfile diff to review. That IS a supply-chain event.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything must come from crates.io. An unknown registry or an ad-hoc git
# dependency is the exact shape of a dependency-confusion attack, and would
# otherwise be invisible in review.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
