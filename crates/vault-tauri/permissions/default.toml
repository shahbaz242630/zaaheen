"$schema" = "schemas/schema.json"

# Default permission set for vault-tauri — Tauri commands per BRD §5.11.
# Each command needs an explicit permission entry per Tauri 2.5+
# strict-permissions model. Capabilities reference these in
# `capabilities/default.json::permissions`.

[default]
description = "Default permissions for vault-tauri commands"
permissions = [
  "allow-add-memory",
  "allow-search-memories",
  "allow-update-memory",
  "allow-delete-memory",
  "allow-list-recent-memories",
  "allow-list-boundaries",
  "allow-create-boundary",
  "allow-list-agents",
  "allow-revoke-agent",
  "allow-get-settings-info",
  "allow-ensure-recall-engine",
]

[[permission]]
identifier = "allow-add-memory"
description = "Allow invoking the add_memory command (write a new memory to the vault)."
commands.allow = ["add_memory"]

[[permission]]
identifier = "allow-search-memories"
description = "Allow invoking the search_memories command (semantic search over the vault)."
commands.allow = ["search_memories"]

[[permission]]
identifier = "allow-update-memory"
description = "Allow invoking the update_memory command (replace an existing memory's content + classification per ADR-028)."
commands.allow = ["update_memory"]

[[permission]]
identifier = "allow-delete-memory"
description = "Allow invoking the delete_memory command (delete a memory by id)."
commands.allow = ["delete_memory"]

# UI slice 2 — vault administration surface (Boundaries / Agents / Settings
# tabs + the home "recently remembered" list).

[[permission]]
identifier = "allow-list-recent-memories"
description = "Allow invoking the list_recent_memories command (newest-first memories for the home list, including agent-written ones)."
commands.allow = ["list_recent_memories"]

[[permission]]
identifier = "allow-list-boundaries"
description = "Allow invoking the list_boundaries command (registered boundaries with their active-memory counts)."
commands.allow = ["list_boundaries"]

[[permission]]
identifier = "allow-create-boundary"
description = "Allow invoking the create_boundary command (register a named boundary before any memory is stored in it)."
commands.allow = ["create_boundary"]

[[permission]]
identifier = "allow-list-agents"
description = "Allow invoking the list_agents command (read the ADR-SEC-001 capability-token registry; never exposes a token or its hash)."
commands.allow = ["list_agents"]

[[permission]]
identifier = "allow-revoke-agent"
description = "Allow invoking the revoke_agent command (soft-revoke an agent's capability token, preserving the audit trail)."
commands.allow = ["revoke_agent"]

[[permission]]
identifier = "allow-get-settings-info"
description = "Allow invoking the get_settings_info command (vault path, version, counts, audit-chain verification result)."
commands.allow = ["get_settings_info"]

# First-run acquisition (ADR-089).

[[permission]]
identifier = "allow-ensure-recall-engine"
description = "Allow invoking the ensure_recall_engine command (fetch and integrity-verify the recall engine's files on first run). Takes no parameters — the destination, source and expected hashes are all fixed at build time."
commands.allow = ["ensure_recall_engine"]

# Readiness reporting + warm-up (ADR-090).

[[permission]]
identifier = "allow-recall-engine-state"
description = "Allow invoking the recall_engine_state command (report whether the recall engine is ready, still preparing, not yet acquired, or not configured). Takes no parameters and is side-effect free."
commands.allow = ["recall_engine_state"]

[[permission]]
identifier = "allow-warm-recall-engine"
description = "Allow invoking the warm_recall_engine command (request a background load of the recall engine so the first recall is not slowed by it). Takes no parameters; idempotent."
commands.allow = ["warm_recall_engine"]

# Automatic maintenance (ADR-092/093) — the scheduler + the Phi-4 download.

[[permission]]
identifier = "allow-ensure-maintenance-engine"
description = "Allow invoking the ensure_maintenance_engine command (first-run download + integrity-verify of the maintenance model). Takes no parameters; the destination, source and expected hash are fixed at build time. Non-gating."
commands.allow = ["ensure_maintenance_engine"]

[[permission]]
identifier = "allow-get-maintenance-schedule"
description = "Allow invoking the get_maintenance_schedule command (read the current automatic-maintenance schedule, OS registration state, engine readiness, and last-run outcome). Side-effect free."
commands.allow = ["get_maintenance_schedule"]

[[permission]]
identifier = "allow-set-maintenance-schedule"
description = "Allow invoking the set_maintenance_schedule command (turn automatic maintenance on/off and set its daily/weekly time by registering or removing a per-user OS task)."
commands.allow = ["set_maintenance_schedule"]

[[permission]]
identifier = "allow-run-maintenance-now"
description = "Allow invoking the run_maintenance_now command (run one consolidation immediately by spawning the bundled vault-cli; skips cleanly if the vault is in use)."
commands.allow = ["run_maintenance_now"]

# Diagnostic-log export (ADR-SEC-017).

[[permission]]
identifier = "allow-export-logs"
description = "Allow invoking the export_logs command (save a copy of the application's own activity record to a location the user chooses, so it can be sent for support). Reads only the app's diagnostic log, which carries no memory content by construction; the audit log is not included."
commands.allow = ["export_logs"]

[[permission]]
identifier = "allow-erase-everything"
description = "Allow invoking the erase_everything command (permanently destroy every memory in this vault by destroying its encryption key in the operating system credential store, then removing the vault's data files). Irreversible."
commands.allow = ["erase_everything"]

[[permission]]
identifier = "allow-account-status"
description = "Allow invoking the account_status command (report whether somebody is signed in on this computer, the state of their subscription, and how many days of it remain). Reads the account folder only; it is never given the vault, so it cannot reach a memory."
commands.allow = ["account_status"]

[[permission]]
identifier = "allow-account-sign-in"
description = "Allow invoking the account_sign_in command (open the person's browser to sign in, and finish the exchange when it returns). The authorization code and its verifier never cross into the webview. Never given the vault."
commands.allow = ["account_sign_in"]

[[permission]]
identifier = "allow-account-sign-out"
description = "Allow invoking the account_sign_out command (revoke this computer's token, delete it from the credential store, and clear the account folder). Never given the vault; signing out removes no memories."
commands.allow = ["account_sign_out"]

[[permission]]
identifier = "allow-account-subscribe"
description = "Allow invoking the account_subscribe command (start a subscription, or open the billing portal for one that already exists). Takes a plan name, never a URL: where it leads is decided, validated and opened by the application. Never given the vault."
commands.allow = ["account_subscribe"]

[[permission]]
identifier = "allow-account-refresh-now"
description = "Allow invoking the account_refresh_now command (\"I've paid\": check the subscription again straight away rather than waiting for the daily check). Never given the vault."
commands.allow = ["account_refresh_now"]

[[permission]]
identifier = "allow-export-memories"
description = "Allow invoking the export_memories command (write every memory to one readable Markdown file at a location the person chooses). This is the one ungated command that reads the vault, and it is ungated on purpose: it is how somebody who is locked out gets their own memories back. It only reads, writes one local file, and sends nothing anywhere."
commands.allow = ["export_memories"]
