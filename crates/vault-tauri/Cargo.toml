[package]
name = "vault-tauri"
description = "The desktop app: its window, screens and installer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

# vault-tauri is BOTH a library (testable utility functions) AND a binary
# (the Tauri shell). ADR-003 "converts to binary at T0.1.11" interpreted as
# "add binary target" — keeping the lib target lets us unit-test env-var
# parsing, OS-dispatch, and integrity-failure mapping without launching the
# Tauri runtime. Standard Rust pattern for testable applications.
[lib]
name = "vault_tauri"
path = "src/lib.rs"

# The shipped desktop application (ADR-SEC-018). Renamed from `vault-tauri`
# because this name IS user-visible, in places the crate name has no business
# appearing: C:\Program Files\Zaaheen\, Task Manager's process list, and the
# Windows firewall prompt.
#
# `zaaheen-desktop` and NOT plain `zaaheen`: the vault-cli package already
# produces a binary called `zaaheen`, and two targets emitting the same
# filename collide in target/release. The CLI keeps the short name because that
# is the one a human TYPES (`command = "zaaheen"` in every MCP config); the app
# is only ever launched from a shortcut, so it can afford the longer one. Same
# split VS Code makes with `Code.exe` and `code`.
#
# The LIB target above keeps the `vault_tauri` name - internal, and the test
# suite imports it.
[[bin]]
name = "zaaheen-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }

# Workspace types we wire through.
vault-core = { path = "../vault-core" }
vault-app = { path = "../vault-app" }
vault-storage = { path = "../vault-storage" }
# Phase 4b: Tauri commands dispatch through Adapter (vault-mcp trait + ToolInvokeDetails / ToolInvokeError).
# vault-retrieval, vault-embedding and vault-llm were listed here too; the code
# that used them moved behind vault-app (ADR-108), so they arrive through it.
vault-mcp = { path = "../vault-mcp" }
# ADR-092: the cross-platform OS scheduler for automatic maintenance. Depends
# only on vault-core; the maintenance commands build a ScheduleSpec from it.
vault-scheduler = { path = "../vault-scheduler" }

# Async runtime + tracing per workspace deps.
#
# `tracing-subscriber` is deliberately NOT declared here any more: subscriber
# setup moved to `vault_app::logging` (ADR-SEC-015) so the desktop app and the
# windowless maintenance runner write one log through one implementation. This
# crate emits events and no longer configures where they go.
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Time-of-day / weekday for the maintenance schedule, and the last-run
# timestamp. Same pin as the rest of the workspace.
chrono = { workspace = true }

# Error types for ConfigError per ADR-032 + ADR-019 OS-dispatch errors.
thiserror = { workspace = true }

# ADR-108 (D4): the desktop is a client of the keeper. `rmcp` for the admin
# call's request and result types, `tokio-util` for cancelling a search a newer
# one replaced. Both already in this crate's graph through vault-app, with the
# same pins and features, so nothing new is compiled.
rmcp = { workspace = true, features = ["client"] }
tokio-util = { workspace = true }

# The Mac update arrives as Zaaheen.app.tar.gz, unpacked by the updater's `zip` feature (tar +
# flate2). Windows leaves it off: see the workspace pin (AUTO-UPDATE-DESIGN.md §4).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = { workspace = true, features = ["zip"] }

[dev-dependencies]
# `model_fetch` path-resolution tests assert against a real temp directory to
# prove the lookup helper creates nothing on disk.
tempfile = { workspace = true }
# The guard's tests supply their own `EntitlementCheck`, which is an
# `#[async_trait]` trait. Dev-only, and no new supply-chain weight: the same
# pinned version already arrives with `vault-mcp`.
async-trait = { workspace = true }
