[package]
name = "vault-app"
description = "Application core. Wires concrete implementations of all module traits. See BRD §5.10."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Async traits — VaultAdapter implements vault_mcp::Adapter (async).
async-trait.workspace = true

# chrono — Utc::now() for last_accessed advancement on update per ADR-028.
chrono = { workspace = true }

# Tokio — async runtime for the Adapter impls + audit append paths.
tokio = { workspace = true }
# CancellationToken: the relay cancels calls the AI app gave up on (s59).
tokio-util = { workspace = true }

# tracing — structured logs at the application boundary.
tracing.workspace = true

# thiserror — `account::AccountSetupError` (BRD §2: thiserror per crate).
# Already in the lockfile via vault-core and vault-account; no new crate
# enters the tree.
thiserror = { workspace = true }

# tracing-subscriber — backs `logging::init`, the shared on-disk application
# log (ADR-SEC-014, moved here by ADR-SEC-015 so the desktop app and the
# windowless maintenance path write one file through one implementation).
# Already compiled for this workspace via vault-tauri and vault-cli; declaring
# it here adds no new crate to the tree.
tracing-subscriber = { workspace = true }

# serde + serde_json — `maintenance_state` reads and writes `maintenance.json`,
# the schedule + last-run file shared by the desktop app and whichever process
# actually ran maintenance (ADR-SEC-016). Both were already dev-dependencies of
# this crate; the production declaration makes the shared type buildable.
serde = { workspace = true }
serde_json = { workspace = true }
# Free space on a chosen folder's drive (ADR-105 L4.5); see the workspace entry.
fs4 = { workspace = true }

# Domain types: Memory, MemoryId, NewMemory, Boundary, VaultError.
vault-core = { path = "../vault-core" }

# vault-mcp Adapter trait — VaultAdapter is the production impl.
vault-mcp = { path = "../vault-mcp" }

# vault-account — the Zaaheen account on this computer (ADR-104 +
# ADR-SEC-022). `entitlement::AccountCheck` is the join between it and
# vault-mcp's gate, which is this crate's job as the composition root
# (SIGNIN-DESIGN.md §8.26 §2: vault-app -> {vault-account, vault-mcp}).
# vault-mcp does NOT depend on vault-account: the gate asks a trait.
vault-account = { path = "../vault-account" }
# Opening the sign-in page, the pay page and the billing portal in the
# person's browser (S3 step 4b). Called only from Rust: no Tauri command ever
# takes a URL, so nothing the frontend says can reach the operating system.
open = { workspace = true }
# Parsing and building those links. Already in the lockfile via
# vault-account; declared here because `external_link` names it directly.
url = { workspace = true }
# ADR-106: the Claude desktop extension ("Zaaheen for Claude.mcpb") is a
# small zip made at the click. Already in the lockfile at this exact version
# (libduckdb-sys builds with it); no compression features, since the three
# entries are stored as they are.
zip = { version = "=6.0.0", default-features = false }

# rmcp — used directly by `Application::start_with_mcp` (T0.1.10 Phase 2)
# to bind `rmcp::transport::stdio()` and call `ServiceExt::serve` on a
# `StdioServer`. Already a transitive dep via vault-mcp; the direct
# declaration here makes the use explicit. Features:
# - `server`: enables ServerHandler-trait surface (StdioServer impls it
#   via vault-mcp's macros) + ServiceExt::serve.
# - `transport-io`: enables `rmcp::transport::stdio()` for process
#   stdin/stdout transport. Same feature vault-mcp uses.
# - `transport-async-rw` (ADR-102): the keeper serves each relay, and the relay
#   talks to the keeper, over one authenticated local IPC stream (named pipe /
#   unix socket) — any AsyncRead+AsyncWrite. Already enabled for vault-mcp.
# - `client` (ADR-102): the relay is an MCP client of its own keeper. Only the
#   small client role — no HTTP client, so no reqwest in this graph. Already
#   compiled on every CI leg as a dev-dependency here and in vault-mcp. ADR-026's
#   host-side threat class does not apply: the relay spawns nothing and passes
#   no user input into `StdioServerParameters` (ADR-SEC-019).
# - `macros` (ADR-108): the desktop's admin surface (`admin/server.rs`) is a
#   tool router like vault-mcp's `StdioServer`. Already compiled for vault-mcp,
#   so feature unification adds no crate to the graph.
rmcp = { workspace = true, features = ["server", "macros", "transport-io", "transport-async-rw", "client"] }

# Retriever trait — VaultAdapter::search delegates to the wired
# `Arc<dyn Retriever>` (T0.2.7 Phase 4: AbstainingRetriever wrapping
# HybridRetriever(SemanticRetriever, KeywordRetriever)). T0.2.7 Phase 4
# also adds VaultAdapter::read delegating to a wired
# Option<ReadPipeline>, which is constructed when AppConfig
# `qwen_model_path` is `Some`.
vault-retrieval = { path = "../vault-retrieval" }

# LlmProvider trait + Qwen25_14BProvider + TuningConfig — VaultAdapter
# holds Option<ReadPipeline> for `Adapter::read`. Only constructed at
# Application::new when AppConfig.qwen_model_path is Some; tests + CI
# leave it None (no 4.36 GB GGUF on disk). Per ADR-049 the locked
# production model is Qwen2.5-7B-Instruct-Q4_K_M.gguf with the
# llama-cpp-2 backend (Metal on macOS, Vulkan on Windows/Linux).
vault-llm = { path = "../vault-llm" }

# StorageBackend orchestrator + MetadataStore + audit primitives —
# VaultAdapter holds StorageBackend + MetadataStore (separate handle
# for `append_tool_invoke_audit`; both share the same `Arc<Inner>`
# SQLCipher connection so no duplicate opens).
vault-storage = { path = "../vault-storage" }

# EmbeddingProvider trait — VaultAdapter::write / ::update embed the
# new content before calling StorageBackend::write_memory /
# update_memory (StorageBackend takes a pre-computed embedding).
vault-embedding = { path = "../vault-embedding" }

# Consolidator + ConsolidatorConfig + ConsolidationReport — added at
# T0.3.x Batch A (2026-05-26) per the architectural lock. Application
# constructs Consolidator when AppConfig.phi4_model_path is Some, and
# exposes `Application::run_consolidation_with_safety` wrapping the
# inner run with a cross-process lockfile + 30-min hard timeout
# (locked-next-arc Step 4 operational-safety contract). Phi-4-mini
# stays at consolidation per the 2026-05-26 lock; Qwen-7B exits the
# read path at Commit 6.
vault-consolidator = { path = "../vault-consolidator" }

# uuid — `run_id = Uuid::new_v4()` correlation ID for the consolidator
# safety-wrapper tracing span. Added at T0.3.x Batch A.
uuid = { workspace = true }

# Keychain helper — `vault_app::keychain` reads the master_key from the
# OS keychain at vault-tauri startup (per ADR-040 + ADR-040 amendment).
# `keyring-core` is the library API crate (April 2026 v1.0.0 release;
# the older `keyring` crate at v4 is sample-code-only with explicit
# do-not-depend warning). Cross-platform deps land per-platform; Phase 1
# wires Windows only (per ADR-029 V0.1 dogfood pattern + HANDOFF.md
# OQ #1 partial resolution). macOS / Linux per-platform stores added at
# T0.2.0.x sub-task or T0.2.14 Stub-Installer-adjacent.
keyring-core = { workspace = true }

# Random bytes for master_key generation on first run (no keychain entry
# exists). hex-encoding the BLAKE3-derived SqlCipher subkey to a 64-char
# String passphrase per ADR-040 amendment option β derivation tree.
getrandom = { workspace = true }
hex = { workspace = true }

# zeroize: master_key + at_rest_key are wrapped in `Zeroizing<[u8; 32]>`
# per BRD §11.5.3 / ADR-008 amendment K3-KDF wrapper pattern. Used in the
# keychain helper module's public surface.
zeroize = { workspace = true }

# blake3 — domain-separated subkey derivation per ADR-040 amendment option β
# (sqlcipher_passphrase via "vault sqlcipher passphrase v1" prefix;
# at_rest_key via "vault memory at-rest sealing v1" prefix per ADR-008
# amendment K3 KDF).
blake3 = { workspace = true }

# vault-storage: SqlCipherKey is the type returned by
# `derive_sqlcipher_passphrase`; needed in the keychain helper's signature.
# Already a transitive dep via the existing vault-storage entry above; this
# direct workspace path is implicit through the module-internal use.

# Windows-only Credential Manager backend. Gated so Linux/macOS builds
# don't pull it. The `vault_app::keychain` module is itself cfg-gated
# Windows-only; cross-platform support adds per-platform store crates
# (apple-native-keyring-store, linux-keyutils-keyring-store,
# dbus-secret-service-keyring-store) at T0.2.0.x sub-task per ADR-040.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true }

# Feature flag exposing `vault_app::keychain::test_helpers` to other crates'
# dev-dependencies (notably vault-cli's tests for sub-task (a) sealed-open
# coverage). Without the flag the module is `#[cfg(test)]`-gated for this
# crate only; the feature flips the gate on for downstream test consumers.
# Promoted at T0.2.0 Phase 3 sub-task (a) (2026-05-11) to eliminate the
# 50-LOC duplication that would otherwise land in vault-cli's tests.
[features]
test-helpers = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
# ADR-106: the Cursor install link's test decodes its base64 `config` to prove
# it carries exactly the manual snippet's server. Already in the tree through
# vault-account (same workspace pin); no new crate.
base64 = { workspace = true }

# Multi-agent daemon SPIKE Stage B (next-arc, 2026-06-23) — DEV-ONLY.
# `tests/concurrent_multiagent_stage_b.rs` proves the REAL three-store stack
# (SQLCipher + LanceDB + DuckDB) survives two agents writing concurrently
# THROUGH the localhost daemon (vs Stage A's mock-backed transport proof in
# vault-mcp). Adds the rmcp client + streamable-HTTP transport features (the
# production rmcp dep above stays server+stdio only) and hyper-util to host the
# `StreamableHttpService` on a loopback port. Exact-pinned to the versions
# already in Cargo.lock — no new crates enter the tree. If the daemon graduates
# to production, these move to `[dependencies]` behind the ADR-SEC decision.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "service", "tokio"] }
# T0.2.0 ADR-041 (2026-05-11): bridge tests construct synthetic V0.1
# SQLCipher fixtures via direct rusqlite usage (PRAGMA key + INSERT).
# Production vault-app code stays rusqlite-free — the bridge composes
# `vault_storage::rekey_in_place` which wraps the SQLCipher dance.
rusqlite = { workspace = true }
