name: Proof - Mac delete fix (throwaway)

# THROWAWAY SPIKE (session 82): never merged. Reproduces "Delete my account"
# on a Mac with the production code paths (see
# crates/vault-tauri/src/commands/maintenance/repro_s82.rs), unsigned and
# signed the way the shipped app is (one identifier for every program).

on:
  push:
    branches: ['repro/**']

permissions:
  contents: read

concurrency:
  group: repro-mac-delete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        variant: [fresh, update]
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # No account settings: nobody can sign in on a runner, and a build without
      # them serves ungated, so the keeper creates the key and serves.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Provision the embedder model and ONNX Runtime (arm64 dylib)
        run: bash scripts/setup-dev-env.sh
      - name: Placeholder onnxruntime.dll for the base config's resource check
        run: touch crates/vault-embedding/test-fixtures/bge-small-en-v1.5/onnxruntime.dll

      - name: Build the command-line programs and the repro test (release)
        run: |
          cargo build --release -p vault-cli --bins
          EXE=$(cargo test -p vault-tauri --release --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "vault_tauri") | .executable' | tail -1)
          echo "test binary: $EXE"
          D="$RUNNER_TEMP/zaaheen-run"
          mkdir -p "$D/models" "$D/libs"
          cp "$EXE" "$D/zaaheen-desktop-repro"
          cp target/release/zaaheen target/release/zaaheen-maintenance "$D/"
          F=crates/vault-embedding/test-fixtures/bge-small-en-v1.5
          cp "$F/model.onnx" "$F/tokenizer.json" "$D/models/"
          cp "$F/libonnxruntime.dylib" "$D/libs/"
          ls -la "$D" "$D/models" "$D/libs"

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/zaaheen-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASS"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign every program with the app's one identifier (as shipped)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          D="$RUNNER_TEMP/zaaheen-run"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$D/libs/libonnxruntime.dylib"
          for f in "$D/zaaheen" "$D/zaaheen-maintenance" "$D/zaaheen-desktop-repro"; do
            codesign --force --options runtime --timestamp --identifier com.zaaheen.app \
              --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign -dv "$f" 2>&1 | grep -E "Identifier|TeamIdentifier"
          done

      - name: "Update case: the 0.3.0 production zaaheen makes the key at the install path"
        if: matrix.variant == 'update'
        run: |
          D="$RUNNER_TEMP/zaaheen-run"
          curl -fsSL -A "zaaheen-ci-proof" -o "$RUNNER_TEMP/old.dmg" https://dl.zaaheen.com/Zaaheen_0.3.0_aarch64.dmg
          echo "bdb974fc7b7a6de90837b175854a7f1fd6e9d34645e311381ee8ac17a6d07e10  $RUNNER_TEMP/old.dmg" | shasum -a 256 -c
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/old" "$RUNNER_TEMP/old.dmg"
          mv "$D/zaaheen" "$RUNNER_TEMP/zaaheen-new"
          cp "$RUNNER_TEMP/old/Zaaheen.app/Contents/MacOS/zaaheen" "$D/zaaheen"
          hdiutil detach "$RUNNER_TEMP/old"
          codesign -dv "$D/zaaheen" 2>&1 | grep -E "Identifier|TeamIdentifier|CDHash"
          "$D/zaaheen" --version
          # A direct command sets the location up and opens the vault: it makes the key.
          "$D/zaaheen" divergence-check || echo "divergence-check exit $?"
          security find-generic-password -s com.zaaheen.v0.2 -a default > /dev/null && echo "OLD BUILD MADE THE KEY" || { echo "no key made by the old build"; exit 1; }
          # The update: the new build replaces the old one at the same path.
          mv "$RUNNER_TEMP/zaaheen-new" "$D/zaaheen"
          codesign -dv "$D/zaaheen" 2>&1 | grep -E "Identifier|TeamIdentifier|CDHash"

      - name: Run the repro
        timeout-minutes: 20
        run: |
          D="$RUNNER_TEMP/zaaheen-run"
          export REPRO_OUT="$RUNNER_TEMP/repro-out"
          mkdir -p "$REPRO_OUT"
          security list-keychains -d user
          security default-keychain -d user
          set +e
          "$D/zaaheen-desktop-repro" --ignored --exact commands::maintenance::repro_s82::repro_s82_mac_delete --nocapture 2>&1 | tee "$REPRO_OUT/repro.log"
          CODE=${PIPESTATUS[0]}
          echo "repro exit: $CODE"
          echo "== STEP / PROOF lines"; grep -E "STEP (START|DONE|HANG)|PROOF|SUMMARY" "$REPRO_OUT/repro.log"
          exit $CODE

      - name: Evidence
        if: always()
        run: |
          OUT="$RUNNER_TEMP/repro-out"
          cp -R "$HOME/Library/Logs/com.zaaheen.app" "$OUT/app-logs" 2>/dev/null || true
          ls -la "$OUT" || true
          for f in "$OUT"/*sample*.txt; do
            [ -f "$f" ] || continue
            echo "===== $f (heaviest stacks)"; sed -n '/Call graph:/,/Total number in stack/p' "$f" | head -150
          done
          for f in "$OUT"/app-logs/*; do echo "===== $f"; tail -60 "$f"; done
          pgrep -l zaaheen || true
          launchctl list | grep -i zaaheen || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-${{ matrix.variant }}
          path: ${{ runner.temp }}/repro-out
          retention-days: 3

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/zaaheen-signing.keychain-db" 2>/dev/null || true
