name: Secret scan (full history)

# The pull request scan in ci.yml is incremental -- gitleaks-action scans only
# the commits in the triggering event. That is the right default (it is fast and
# catches new leaks at the point they are introduced) but it can never establish
# a baseline, and it cannot find a secret that entered the repository before the
# scanner existed.
#
# This repository has existed since 2026-04-28 with NO secret scanning of any
# kind, so that baseline has never been established even once. This workflow
# scans every commit. It runs weekly and on every push to main, so a leak that
# slipped through incremental scanning is found within days rather than never.
# It matters more than usual on a public repository, where a secret is scraped
# within seconds of being pushed and rewriting history does not un-leak it.
#
# Ported from the equivalent workflow already proven on tools-project.

on:
  # EVERY branch, not just main. `actions/checkout` with `fetch-depth: 0`
  # fetches every remote branch, and `gitleaks detect` scans all of them, so a
  # branch's content is in scope for this job wherever it runs. While this
  # triggered on main only, pushing a branch could leave the job red and the
  # failure surfaced days later, on whoever pushed main next -- which is
  # exactly what `site/production-ready` did on 2026-09-13 (green 09-11, red
  # from the 09-14 cron onwards, found 09-17 on an unrelated merge). The
  # person who introduces a finding now sees it on their own push.
  push:
    branches: ['**']
  schedule:
    - cron: '47 5 * * 1'
  # Available on demand, for after any incident or config change.
  workflow_dispatch:

concurrency:
  group: secret-scan-history-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-history:
    name: Scan every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every commit, not just the tip.
          fetch-depth: 0

      # The gitleaks binary directly rather than the action, because the action
      # constrains itself to the event's commit range and there is no input to
      # widen it. Pinned by digest-bearing tag so a scanner change is a
      # deliberate update rather than a silent one.
      - name: Scan full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            detect \
              --config .gitleaks.toml \
              --source . \
              --redact \
              --verbose \
              --report-format sarif \
              --report-path gitleaks-history.sarif

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif
          retention-days: 30
          if-no-files-found: ignore
