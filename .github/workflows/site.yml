name: Site

# zaaheen.com: build, audit and (on main) publish. Policy: SEO-HANDOFF.md
# (repo root, kept local and gitignored).
#
# Hostinger's Git deployment copies a whole branch into public_html and runs no
# build step, so it must never point at main (that would publish the product's
# source tree). Instead the built site is committed to the site-deploy branch,
# which holds nothing else, and Hostinger auto-deploys that branch.
#
# Publishing is off until launch: repository variable SITE_PUBLISH turns on
# both the release audit (no placeholder copy, live payments) and the deploy
# job. Until it is 'true', main builds and audits the site and publishes
# nothing, so the site can live on main before its copy is final.
#
# account.zaaheen.com (AUTH-PAGES-DESIGN D1) is its own site: the account-build
# and account-deploy jobs publish it to the account-deploy branch, which its own
# Hostinger site deploys. Switched on separately by ACCOUNT_PUBLISH, with the
# production settings in repository variables CLERK_PUBLISHABLE_KEY (pk_live_)
# and ZAAHEEN_CLIENT_ID. zaaheen.com links to it from every header, so it is
# never published while ACCOUNT_PUBLISH is off.
#
# Cloudflare (session 105, ADR-SEC-047): Hostinger's shared servers answer 429
# to OpenAI's and Meta's crawlers by name and cannot be told otherwise, so both
# sites are served by Cloudflare as static assets (Workers zaaheen-site and
# zaaheen-account, configs in site/cloudflare/). With repository variable
# CLOUDFLARE_PUBLISH 'true', the cloudflare-deploy and account-cloudflare-deploy
# jobs publish the SAME audited artifacts there, after the Hostinger jobs, which
# keep running: Hostinger stays a current fallback until it is retired. The live
# checks then run after the Cloudflare publish instead. Cloudflare reads
# _headers and _redirects, made from the .htaccess files at build time
# (scripts/cloudflare-files.mjs); each host gets only its own files. Needs
# secret CLOUDFLARE_SITES_TOKEN in the main-only environment cloudflare-sites
# (Cloudflare's Edit Cloudflare Workers template, this account and zone only)
# and variable CLOUDFLARE_ACCOUNT_ID. Both jobs wait for the Hostinger jobs while
# both hosts are published; drop those needs when Hostinger is retired.

on:
  pull_request:
    # crates/vault-tauri/dist/app.js: the guides read the app's connect wording
    # from it (site/src/data/app-words.ts), so a wording change rebuilds the site (s83).
    paths: ['site/**', '.github/workflows/site.yml', 'crates/vault-tauri/dist/app.js']
  push:
    branches: [main]
    # crates/vault-tauri/dist/app.js: the guides read the app's connect wording
    # from it (site/src/data/app-words.ts), so a wording change rebuilds the site (s83).
    paths: ['site/**', '.github/workflows/site.yml', 'crates/vault-tauri/dist/app.js']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a guide's datePublished is the commit that added its
          # page file (lib/lastmod.ts). A shallow clone would date every guide today.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # No dependency install scripts (audit s104 SUP-10): the build needs none
      # (proven: build, audit and tests pass without them), and npm 10 on Node 22
      # would otherwise run every one a dependency ships.
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          # The /pay page's Paddle environment and client-side token (both
          # public; kept out of the repo as account identifiers). Repository
          # variables; the --release audit below refuses anything but
          # production with a live_ token.
          PUBLIC_PADDLE_ENVIRONMENT: ${{ vars.PADDLE_ENVIRONMENT }}
          PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
      - name: Audit the build (fails on anything that hurts search or AI visibility)
        run: npm run check
      - name: Refuse placeholder copy on a build that will be published
        # Same condition as the deploy job: only main publishes, once switched on.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_PUBLISH == 'true'
        run: npm run check -- --release
      - name: Refuse to publish zaaheen.com before its account pages
        # Every header links to account.zaaheen.com: publishing without it
        # would ship "Sign in" and "Get started" buttons that lead nowhere.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_PUBLISH == 'true' && vars.ACCOUNT_PUBLISH != 'true'
        run: |
          echo "::error::SITE_PUBLISH is on but ACCOUNT_PUBLISH is not: publish account.zaaheen.com first (AUTH-PAGES-DESIGN D1)."
          exit 1
      - name: Prove the audit still catches what it claims to
        run: npm test
      # account.zaaheen.com (AUTH-PAGES-DESIGN): built here with fixed, made-up
      # development settings, so its tests and audit run on every change. Not
      # published: its own deploy (real settings, --release audit) comes with
      # the production setup.
      - name: Prove the vendored Clerk file is exactly what npm published
        run: node scripts/vendor-clerk.mjs --check
      - name: Build the account pages (test settings)
        run: npm run build:account:test
      - name: Test the account pages (redirect check, states, source rules, audit)
        run: npm run test:account
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          # .htaccess is a dot-file: without this it is silently dropped, and the
          # 404 page, www redirect and security headers go with it.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to Hostinger
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that can write, and it never installs or runs npm packages.
    permissions:
      contents: write
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: site/scripts
          # The push below uses its own token remote; the write token must not
          # sit in .git/config while the live-check scripts run (audit s104 SUP-10).
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist
      - name: Commit the build to the site-deploy branch
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/.htaccess || { echo "::error::.htaccess missing from the artifact"; exit 1; }
          # Cloudflare's files mean nothing to Hostinger, which would serve them as pages.
          rm -f dist/_headers dist/_redirects
          # The Cloudflare job reads the changed pages from here (IndexNow), even when nothing changed.
          : > "$GITHUB_WORKSPACE/changed.txt"
          # While the app is not on sale (no installer link on the home page,
          # RELEASE.available false in site/src/data/site.ts), /pay is not
          # published: its checkout has no live payment settings yet. The
          # release audit applies the same test (ON_SALE in scripts/audit.mjs).
          if ! grep -Eq '[[:space:]]href="https://dl\.zaaheen\.com/' dist/index.html; then
            rm -rf dist/pay
            echo "App not on sale yet: /pay left out of the published site."
          fi
          # The live-site check waits until this file matches the commit.
          echo "$GITHUB_SHA" > dist/build.txt

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$RUNNER_TEMP/site-deploy"
          mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 "$remote" site-deploy 2>/dev/null; then
            git checkout -q -b site-deploy FETCH_HEAD
            first=false
          else
            git checkout -q --orphan site-deploy
            first=true
          fi

          # Replace the whole tree with the new build, so deleted pages are
          # deleted on the server too.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Build identical to what is deployed; nothing to publish."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Deploy zaaheen.com from ${GITHUB_SHA}"
          if [ "$first" = true ]; then
            git ls-files > "$GITHUB_WORKSPACE/changed.txt"
          else
            git diff --name-only HEAD~1 HEAD > "$GITHUB_WORKSPACE/changed.txt"
          fi
          git push -q "$remote" site-deploy
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Published $(wc -l < "$GITHUB_WORKSPACE/changed.txt") changed file(s)."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: vars.CLOUDFLARE_PUBLISH == 'true'
        with:
          name: site-changed
          path: changed.txt
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.publish.outputs.pushed == 'true' && vars.SITE_LIVE == 'true' && vars.CLOUDFLARE_PUBLISH != 'true'
        with:
          node-version: 22
      - name: Verify the live site, then notify IndexNow
        # SITE_LIVE is a repository variable, set to true once Hostinger serves
        # zaaheen.com. Until then there is no live site to check. With
        # CLOUDFLARE_PUBLISH on, the live site is Cloudflare and cloudflare-deploy checks it.
        if: steps.publish.outputs.pushed == 'true' && vars.SITE_LIVE == 'true' && vars.CLOUDFLARE_PUBLISH != 'true'
        run: node site/scripts/post-deploy.mjs --sha "$GITHUB_SHA" --changed changed.txt --wait 600

  cloudflare-deploy:
    name: Publish zaaheen.com to Cloudflare
    # After the Hostinger publish, so it can reuse that job's list of changed
    # pages for IndexNow and both copies always carry the same build.
    needs: [build, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_PUBLISH == 'true' && vars.CLOUDFLARE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The token lives in this environment, which only main can use: a workflow
    # pushed on any other branch cannot read it (independent review, s105).
    environment: cloudflare-sites
    # Read-only to GitHub. The only credential is the Cloudflare token.
    permissions:
      contents: read
    concurrency:
      group: cloudflare-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # site/scripts + site/public: the live checks. site/cloudflare: the
          # wrangler config. workers/account: the exact, reviewed wrangler
          # version and its lockfile (Dependabot keeps it current).
          sparse-checkout: |
            site/scripts
            site/public
            site/cloudflare
            workers/account
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: site/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-changed
          path: .
      - name: Prepare the build for Cloudflare
        working-directory: site
        run: |
          set -euo pipefail
          test -f dist/_headers || { echo "::error::_headers missing from the artifact"; exit 1; }
          test -f dist/_redirects || { echo "::error::_redirects missing from the artifact"; exit 1; }
          # Same rule as the Hostinger publish: no /pay while the app is not on sale.
          if ! grep -Eq '[[:space:]]href="https://dl\.zaaheen\.com/' dist/index.html; then
            rm -rf dist/pay
            echo "App not on sale yet: /pay left out of the published site."
          fi
          # Hostinger's server files mean nothing to Cloudflare, which would serve them.
          find dist -name .htaccess -delete
          echo "$GITHUB_SHA" > dist/build.txt
      # npm 11 (Node 24) runs no dependency install scripts by default; said
      # again here, since this job holds a deploy credential.
      - name: Install wrangler from the account Worker's lockfile
        working-directory: workers/account
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Publish to Cloudflare
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config "$GITHUB_WORKSPACE/site/cloudflare/site.jsonc" --message "zaaheen.com from $GITHUB_SHA"
      - name: Verify the live site, then notify IndexNow
        # SITE_LIVE: zaaheen.com is served (now by Cloudflare). The changed list is
        # empty when the Hostinger copy was already identical: nothing to ping.
        if: vars.SITE_LIVE == 'true'
        run: node site/scripts/post-deploy.mjs --sha "$GITHUB_SHA" --changed changed.txt --wait 600

  account-build:
    name: Build and audit account.zaaheen.com (production settings)
    # Only for a publish: pull requests and main already build and test the
    # account pages with made-up settings in the build job above.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ACCOUNT_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # No dependency install scripts (audit s104 SUP-10): the build needs none
      # (proven: build, audit and tests pass without them), and npm 10 on Node 22
      # would otherwise run every one a dependency ships.
      - run: npm ci --ignore-scripts
      - name: Prove the vendored Clerk file is exactly what npm published
        run: node scripts/vendor-clerk.mjs --check
      - name: Build the account pages (production settings)
        run: npm run build:account
        env:
          # Both public (D3): the Frontend API host is decoded from the key.
          # The build refuses a pk_test_ key (no ACCOUNT_DEV here).
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          PUBLIC_ZAAHEEN_CLIENT_ID: ${{ vars.ZAAHEEN_CLIENT_ID }}
      - name: Release audit (pk_live_ for clerk.zaaheen.com, pinned CSP and headers)
        run: npm run check:account -- --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-dist
          path: site/dist-account
          # The origin's CSP and headers live in .htaccess, a dot-file.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  account-deploy:
    name: Publish account.zaaheen.com to Hostinger
    needs: account-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Like the site deploy: the only job that can write, and it never installs
    # or runs npm packages. The account-deploy branch is protected so only this
    # workflow can push to it (ADR-SEC-034).
    permissions:
      contents: write
    concurrency:
      group: account-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: site/scripts
          # The push below uses its own token remote; the write token must not
          # sit in .git/config while the live-check scripts run (audit s104 SUP-10).
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: account-dist
          path: dist
      - name: Commit the build to the account-deploy branch
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/.htaccess || { echo "::error::.htaccess (the origin's CSP) missing from the artifact"; exit 1; }
          # Cloudflare's files mean nothing to Hostinger, which would serve them as pages.
          rm -f dist/_headers dist/_redirects
          echo "$GITHUB_SHA" > dist/build.txt

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$RUNNER_TEMP/account-deploy"
          mkdir -p "$work" && cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 "$remote" account-deploy 2>/dev/null; then
            git checkout -q -b account-deploy FETCH_HEAD
          else
            git checkout -q --orphan account-deploy
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Build identical to what is deployed; nothing to publish."
            exit 0
          fi
          git commit -q -m "Deploy account.zaaheen.com from ${GITHUB_SHA}"
          git push -q "$remote" account-deploy
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "Published account.zaaheen.com from ${GITHUB_SHA}."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.publish.outputs.pushed == 'true' && vars.ACCOUNT_LIVE == 'true' && vars.CLOUDFLARE_PUBLISH != 'true'
        with:
          node-version: 22
      - name: Verify the live account pages and the Clerk instance
        # ACCOUNT_LIVE is a repository variable, set to true once Hostinger
        # serves account.zaaheen.com. Our own script, no npm packages, no secret:
        # the served build, its headers exactly as its .htaccess sets them, and
        # the production instance's D4/D9 invariants (AUTH-PAGES-DESIGN D9).
        # With CLOUDFLARE_PUBLISH on, account-cloudflare-deploy checks Cloudflare instead.
        if: steps.publish.outputs.pushed == 'true' && vars.ACCOUNT_LIVE == 'true' && vars.CLOUDFLARE_PUBLISH != 'true'
        run: node site/scripts/post-deploy-account.mjs --sha "$GITHUB_SHA" --htaccess dist/.htaccess --wait 600

  account-cloudflare-deploy:
    name: Publish account.zaaheen.com to Cloudflare
    # After the Hostinger publish, so both copies always carry the same build.
    needs: [account-build, account-deploy]
    # account-build is already main-only; said again so an edit there cannot open this.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ACCOUNT_PUBLISH == 'true' && vars.CLOUDFLARE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-sites
    permissions:
      contents: read
    concurrency:
      group: cloudflare-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            site/scripts
            site/cloudflare
            workers/account
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: account-dist
          path: site/dist-account
      - name: Prepare the build for Cloudflare
        working-directory: site
        run: |
          set -euo pipefail
          test -f dist-account/_headers || { echo "::error::_headers (the origin's CSP) missing from the artifact"; exit 1; }
          test -f dist-account/_redirects || { echo "::error::_redirects missing from the artifact"; exit 1; }
          # The live check compares the served headers with the built .htaccess
          # (the same rules as _headers); kept outside what is published.
          mv dist-account/.htaccess "$RUNNER_TEMP/account.htaccess"
          echo "$GITHUB_SHA" > dist-account/build.txt
      - name: Install wrangler from the account Worker's lockfile
        working-directory: workers/account
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Publish to Cloudflare
        working-directory: workers/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config "$GITHUB_WORKSPACE/site/cloudflare/account.jsonc" --message "account.zaaheen.com from $GITHUB_SHA"
      - name: Verify the live account pages and the Clerk instance
        if: vars.ACCOUNT_LIVE == 'true'
        run: node site/scripts/post-deploy-account.mjs --sha "$GITHUB_SHA" --htaccess "$RUNNER_TEMP/account.htaccess" --wait 600
