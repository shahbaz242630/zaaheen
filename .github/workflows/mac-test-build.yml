name: Mac test build

# A first Mac test copy (ADR-SEC-038): the key-store tests against the real
# login keychain, then a Developer ID signed and Apple-notarised Zaaheen.app
# for Apple Silicon, signed in to the TEST account system. Not a release: kept
# one day. Runs only on a push to a `mac-test/**` branch.

on:
  push:
    branches: ['mac-test/**']

permissions:
  contents: read

concurrency:
  group: mac-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-test-build:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Provision the embedder model and ONNX Runtime (arm64 dylib)
        run: bash scripts/setup-dev-env.sh
      - name: Placeholder onnxruntime.dll for the base config's resource check
        run: touch crates/vault-embedding/test-fixtures/bge-small-en-v1.5/onnxruntime.dll

      # The Mac key stores, against the runner's real login keychain.
      - name: Key-store and Mac path tests
        run: |
          cargo test -p vault-app --lib -- keychain:: install_paths:: keeper::discovery:: keeper::transport:: connect::
          cargo test -p vault-account --lib -- token_store::

      - name: Build the command-line binaries (release)
        env:
          ZAAHEEN_ACCOUNT_ISSUER: ${{ secrets.MAC_TEST_ACCOUNT_ISSUER }}
          ZAAHEEN_ACCOUNT_CLIENT_ID: ${{ secrets.MAC_TEST_ACCOUNT_CLIENT_ID }}
          ZAAHEEN_ACCOUNT_API: ${{ secrets.MAC_TEST_ACCOUNT_API }}
          ZAAHEEN_LEASE_PRIMARY_KID: ${{ secrets.MAC_TEST_LEASE_PRIMARY_KID }}
          ZAAHEEN_LEASE_PRIMARY_KEY: ${{ secrets.MAC_TEST_LEASE_PRIMARY_KEY }}
          ZAAHEEN_LEASE_BACKUP_KID: ${{ secrets.MAC_TEST_LEASE_BACKUP_KID }}
          ZAAHEEN_LEASE_BACKUP_KEY: ${{ secrets.MAC_TEST_LEASE_BACKUP_KEY }}
        run: cargo build --release -p vault-cli --bins

      - name: Install the Tauri CLI (the version the Windows build uses)
        run: cargo install tauri-cli --version 2.11.0 --locked

      # The Mac app ships its own open-source notices (launch checklist A11):
      # never a copy that differs from the committed, reviewed file.
      - name: The Mac open-source notices are up to date
        shell: pwsh
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          ./scripts/gen-licence-notices.ps1 -Mac -Check

      # The Developer ID certificate goes into a throwaway keychain that is
      # deleted at the end of the job (last step, always).
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/zaaheen-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASS"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Fingerprints only (never the values), to compare with the local copy.
          echo "p12 sha256: $(shasum -a 256 "$RUNNER_TEMP/cert.p12" | cut -c1-16)  pw length: ${#APPLE_CERTIFICATE_PASSWORD}"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      # Tauri signs the app's own binary; the two command-line programs and
      # the ONNX Runtime library are signed here first, hardened and
      # timestamped, so notarisation accepts every executable in the bundle.
      #
      # The two programs carry the APP's identifier (ADR-SEC-038 amendment 1,
      # s78): the login keychain trusts an item's creator by its designated
      # requirement (identifier + team), so with one identifier the window,
      # the keeper and the nightly run are one app to macOS and never ask the
      # person "allow access?" about each other's items.
      - name: Sign the command-line programs and ONNX Runtime
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for f in target/release/zaaheen target/release/zaaheen-maintenance; do
            codesign --force --options runtime --timestamp --identifier com.zaaheen.app \
              --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          f=crates/vault-embedding/test-fixtures/bge-small-en-v1.5/libonnxruntime.dylib
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$f"
          codesign --verify --strict --verbose=2 "$f"

      - name: Build, sign and notarise Zaaheen.app
        working-directory: crates/vault-tauri
        env:
          ZAAHEEN_ACCOUNT_ISSUER: ${{ secrets.MAC_TEST_ACCOUNT_ISSUER }}
          ZAAHEEN_ACCOUNT_CLIENT_ID: ${{ secrets.MAC_TEST_ACCOUNT_CLIENT_ID }}
          ZAAHEEN_ACCOUNT_API: ${{ secrets.MAC_TEST_ACCOUNT_API }}
          ZAAHEEN_LEASE_PRIMARY_KID: ${{ secrets.MAC_TEST_LEASE_PRIMARY_KID }}
          ZAAHEEN_LEASE_PRIMARY_KEY: ${{ secrets.MAC_TEST_LEASE_PRIMARY_KEY }}
          ZAAHEEN_LEASE_BACKUP_KID: ${{ secrets.MAC_TEST_LEASE_BACKUP_KID }}
          ZAAHEEN_LEASE_BACKUP_KEY: ${{ secrets.MAC_TEST_LEASE_BACKUP_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          unset APPLE_API_KEY_P8
          cargo tauri build --config tauri.mac-test.conf.json
          rm -f "$APPLE_API_KEY_PATH"

      - name: Apple accepts the bundle (signature, notarisation ticket, Gatekeeper)
        run: |
          APP=target/release/bundle/macos/Zaaheen.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          for f in "$APP"/Contents/MacOS/* "$APP/Contents/Resources/libs/libonnxruntime.dylib"; do
            codesign -dv "$f" 2>&1 | grep -E 'Authority=Developer ID Application|flags=.*runtime' | sort -u
          done
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          # One app to the keychain: all three programs, one designated requirement.
          reqs=$(for f in zaaheen-desktop zaaheen zaaheen-maintenance; do
            codesign -d -r- "$APP/Contents/MacOS/$f" 2>&1 | grep '^designated'
          done | sort -u)
          echo "$reqs"
          test "$(printf '%s\n' "$reqs" | wc -l | tr -d ' ')" = 1 || { echo "the programs differ in identity"; exit 1; }
          printf '%s\n' "$reqs" | grep -q 'identifier "com.zaaheen.app"' || { echo "not the app identifier"; exit 1; }

      - name: The bundle holds what the app needs, and links nothing outside macOS
        run: |
          APP=target/release/bundle/macos/Zaaheen.app
          ls -la "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Resources/libs" "$APP/Contents/Resources/models"
          for f in zaaheen-desktop zaaheen zaaheen-maintenance; do
            test -x "$APP/Contents/MacOS/$f" || { echo "missing $f"; exit 1; }
          done
          test -s "$APP/Contents/Resources/libs/libonnxruntime.dylib"
          test -s "$APP/Contents/Resources/models/model.onnx"
          test -s "$APP/Contents/Resources/models/tokenizer.json"
          # The Mac's own README and notices, not the Windows installer's.
          grep -q "/Applications/Zaaheen.app/Contents/MacOS/zaaheen" "$APP/Contents/Resources/README.txt"
          grep -q "apple-native-keyring-store" "$APP/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          grep -q "libonnxruntime.dylib" "$APP/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          bad=0
          for f in "$APP"/Contents/MacOS/*; do
            echo "== $f"; otool -L "$f"
            if otool -L "$f" | grep -E '/opt/homebrew|/usr/local'; then bad=1; fi
          done
          exit $bad

      - name: Smoke - the bundled CLI starts
        run: |
          APP="$PWD/target/release/bundle/macos/Zaaheen.app"
          "$APP/Contents/MacOS/zaaheen" --version

      - name: Pack
        run: ditto -c -k --keepParent target/release/bundle/macos/Zaaheen.app Zaaheen-mac-test.zip

      # The customer's download (launch checklist A10): a disk image holding
      # Zaaheen.app and an Applications shortcut to drag it onto. Made with
      # hdiutil (no Finder scripting on a headless runner), then signed,
      # notarised and stapled like the app, so it opens with no warning even
      # offline.
      - name: Make the Mac download (.dmg), signed, notarised and stapled
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto target/release/bundle/macos/Zaaheen.app "$STAGE/Zaaheen.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Zaaheen -srcfolder "$STAGE" -ov -format UDZO Zaaheen-mac-test.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" Zaaheen-mac-test.dmg
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
          xcrun notarytool submit Zaaheen-mac-test.dmg --key "$KEY" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 60m
          rm -f "$KEY"
          xcrun stapler staple Zaaheen-mac-test.dmg
          xcrun stapler validate Zaaheen-mac-test.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 Zaaheen-mac-test.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Zaaheen-mac-test
          path: |
            Zaaheen-mac-test.zip
            Zaaheen-mac-test.dmg
          retention-days: 1
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/zaaheen-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
