name: CodeQL

# Static analysis (BRD §11 SAST). Free on public repositories.
#
# CodeQL support for Rust reached general availability in October 2025,
# together with build-less scanning. `build-mode: none` matters enormously
# here: a full workspace build costs this project roughly an hour on CI, so
# a build-mode analysis would have doubled every pull request's wall-clock.
# Build-less analysis reads the source directly and finishes in minutes,
# which is what makes running this on every PR affordable at all.
#
# Ported from the `Analyse` job already proven on tools-project, with the
# language switched from javascript-typescript to rust.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published rules find existing code rather than waiting
    # for the next pull request to touch it.
    - cron: '41 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Website-only pull requests skip the Rust analysis (founder, session 63).
  # Same rule as ci.yml's `changes` job (.github/scripts/app-changed.sh, proven
  # by app-changed.test.sh first). "Analyse" is not a matrix job, so a skip
  # reports under its own name and counts as passed for main's ruleset. Pushes
  # to main and the weekly run always analyse. TypeScript (below) always runs:
  # the website's scripts are TypeScript and JavaScript.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: bash .github/scripts/app-changed.test.sh
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/app-changed.sh "$EVENT" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  analyse:
    name: Analyse
    needs: changes
    # Runs unless `changes` positively said website-only: if `changes` fails,
    # its output is empty and the analysis runs (a skip would count as passed).
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: rust
          build-mode: none
          # security-extended adds lower-severity rules. Worth the extra time
          # on a codebase whose single guarantee is that a server cannot read
          # user vault contents.
          queries: security-extended

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:rust

  # The account Worker (workers/account) is TypeScript. A separate job, so the
  # required "Analyse" check keeps its name and the Rust alert history its
  # category.
  analyse-typescript:
    name: Analyse (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:javascript-typescript
