name: Mac probe

# Throwaway (s115): before building a Mac update rehearsal, find out what
# GitHub's Mac machine allows. No secrets, no build. Never merged.
#   1  a script can read and press buttons in another app's window
#      (Accessibility, through System Events) - TextEdit stands in for Zaaheen
#   2  the machine can be made to trust a rehearsal root certificate
#   3  a server can listen on 127.0.0.1:443 and is reached by a name in /etc/hosts

on:
  push:
    branches: ['spike/mac-probe-s115']

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Who and where
        run: |
          sw_vers; whoami; id; csrutil status || true
          echo "parent chain:"; ps -o pid,ppid,comm -p $$ -p $PPID

      - name: 1 - Accessibility through System Events
        continue-on-error: true
        run: |
          open -a TextEdit
          sleep 5
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' || echo "PROCESS LIST REFUSED"
          osascript -e 'tell application "System Events" to tell process "TextEdit" to get name of every button of every window' || echo "UI READ REFUSED"
          osascript -e 'tell application "System Events" to tell process "TextEdit" to get entire contents of front window' 2>&1 | head -c 1500 || echo "UI TREE REFUSED"
          osascript -e 'tell application "System Events" to tell process "TextEdit" to click menu item "New Document" of menu "File" of menu bar 1' && echo "CLICK OK" || echo "CLICK REFUSED"

      - name: 2 and 3 - trusted root, hosts, port 443
        continue-on-error: true
        run: |
          D="$RUNNER_TEMP/tls"; mkdir -p "$D"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=probe root' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$D/ca.key" -out "$D/ca.crt"
          openssl req -newkey rsa:2048 -nodes -subj '/CN=dl.zaaheen.com' -keyout "$D/srv.key" -out "$D/srv.csr"
          printf 'subjectAltName=DNS:dl.zaaheen.com\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\n' > "$D/ext.cnf"
          openssl x509 -req -days 2 -in "$D/srv.csr" -CA "$D/ca.crt" -CAkey "$D/ca.key" -CAcreateserial -extfile "$D/ext.cnf" -out "$D/srv.crt"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$D/ca.crt" && echo "TRUST OK (direct)" || {
            echo "direct trust refused; allowing trust settings for admin, then again"
            sudo security authorizationdb write com.apple.trust-settings.admin allow
            sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$D/ca.crt" && echo "TRUST OK (after authorizationdb)" || echo "TRUST REFUSED"
          }
          echo "127.0.0.1 dl.zaaheen.com" | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          mkdir -p "$RUNNER_TEMP/served/updates"; echo '{}' > "$RUNNER_TEMP/served/updates/latest.json"
          cat > "$RUNNER_TEMP/s.mjs" <<'EOF'
          import { createServer } from "node:https";
          import { readFileSync } from "node:fs";
          const [cert, key] = process.argv.slice(2);
          createServer({ cert: readFileSync(cert), key: readFileSync(key) }, (q, r) => r.end("ok\n"))
            .listen(443, "127.0.0.1", () => console.log("listening on 443"));
          EOF
          (node "$RUNNER_TEMP/s.mjs" "$D/srv.crt" "$D/srv.key" > "$RUNNER_TEMP/s.out" 2>&1 &)
          sleep 2; cat "$RUNNER_TEMP/s.out"
          curl -sS -w " http %{http_code}\n" https://dl.zaaheen.com/updates/latest.json && echo "SYSTEM TRUST OK (curl, Secure Transport)" || echo "CURL REFUSED"
          security verify-cert -c "$D/srv.crt" -p ssl -s dl.zaaheen.com && echo "VERIFY-CERT OK" || echo "VERIFY-CERT REFUSED"

      - name: 4 - does a server started in one step survive into the next
        continue-on-error: true
        run: |
          curl -sS -w " http %{http_code}\n" https://dl.zaaheen.com/updates/latest.json && echo "SURVIVES" || echo "GONE"
