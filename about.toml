# cargo-about: the open-source notices that ship in the installer
# (LEGAL-DOCUMENTS-DESIGN.md, decision L7). Generated by
# scripts/gen-licence-notices.ps1 into crates/vault-tauri/THIRD-PARTY-NOTICES.txt.
#
# `accepted` is deny.toml's allow-list, word for word: a crate under any other
# licence fails there first, and here too.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
]
# The Windows installer's target; crates built only for other platforms are not
# in it. The Mac app's file uses `--target aarch64-apple-darwin` instead
# (gen-licence-notices.ps1 -Mac).
targets = ["x86_64-pc-windows-msvc"]
# Build-time and test-time crates are not in the shipped programs.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own workspace crates are not third-party.
private = { ignore = true }
